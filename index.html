<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilz-Hub BW</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Geocoder CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <!-- Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #f5f5f5; }

        #header {
            background: linear-gradient(135deg, #2ca25f, #1a7a45);
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        #header h1 { font-size: 1.3em; }

        #wetter-leiste {
            background: #f0f8ff;
            padding: 10px 20px;
            font-size: 0.95em;
            border-bottom: 1px solid #dde;
        }

        #map { height: calc(100vh - 90px); width: 100%; }
    </style>
</head>
<body>

    <div id="header">
        <h1>🍄 Mays Pilz-Hub BW</h1>
        <span style="font-size: 0.85em; opacity: 0.85;">Baden-Württemberg</span>
    </div>

    <div id="wetter-leiste">
        🌤️ <b>Dein lokales Wetter:</b>
        <span id="wetter-anzeige">Wird geladen (warte auf GPS)...</span>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Geocoder JS -->
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <!-- Routing Machine JS — PINNED Version, kein @latest -->
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <!-- Proj4 (Koordinatenumrechnung) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Turf.js (Geodaten-Analyse) -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <!-- Deine App -->
    <script src="app.js"></script>

</body>
</html>
